server {
    server_name relay.tlab52.ru;

    access_log /var/log/nginx/texturalab-telegram-relay.access.log;
    error_log  /var/log/nginx/texturalab-telegram-relay.error.log;

    client_max_body_size 256k;

    location = /telegram/digest {
        proxy_pass http://127.0.0.1:3001/telegram/digest;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/relay.tlab52.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/relay.tlab52.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = relay.tlab52.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name relay.tlab52.ru;
    return 404; # managed by Certbot
}
