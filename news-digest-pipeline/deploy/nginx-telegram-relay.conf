server {
    listen 80;
    server_name relay.tlab52.ru;

    access_log /var/log/nginx/texturalab-telegram-relay.access.log;
    error_log  /var/log/nginx/texturalab-telegram-relay.error.log;

    client_max_body_size 256k;

    location = /telegram/digest {
        proxy_pass http://127.0.0.1:3001/telegram/digest;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
